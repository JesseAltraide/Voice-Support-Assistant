<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RelayPay Support</title>
<style>
  /* Brand direction: deep blue, teal accent, off-white. No gradients, no ornament.
     The quality is meant to come from spacing and type hierarchy, not decoration. */
  :root {
    --blue: #123a6b;
    --blue-dark: #0d2b50;
    --teal: #0e7c86;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #1a1f2b;
    --muted: #5b6676;
    --line: #e2e6ec;
    --warn: #8a5a00;
    --error: #8c2f2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { width: 100%; max-width: 520px; }
  .brand { font-size: 15px; font-weight: 600; color: var(--blue); margin-bottom: 28px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 40px 36px; }
  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .lede { margin: 0 0 32px; color: var(--muted); font-size: 15px; }

  .status { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-bottom: 24px; font-size: 14px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.live { background: var(--teal); }
  .dot.warn { background: var(--warn); }
  .dot.error { background: var(--error); }

  button {
    width: 100%; padding: 13px 20px; font: inherit; font-weight: 500; color: #fff;
    background: var(--blue); border: 1px solid var(--blue); border-radius: 7px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--blue-dark); border-color: var(--blue-dark); }
  button:disabled { background: #aab3c0; border-color: #aab3c0; cursor: not-allowed; }
  button.secondary { color: var(--blue); background: transparent; border-color: var(--line); }
  button.secondary:hover:not(:disabled) { background: var(--bg); }

  .reason { margin-top: 12px; font-size: 13.5px; color: var(--warn); }
  .reason.error { color: var(--error); }
  .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }

  .transcript { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 20px; max-height: 260px; overflow-y: auto; }
  .line { margin-bottom: 14px; font-size: 14.5px; }
  .line .who { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .line.agent .who { color: var(--teal); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">RelayPay</div>
  <div class="card">
    <h1>Support</h1>
    <p class="lede">Speak to our support assistant about payments, invoices, payouts or your account.</p>

    <!-- The status line is the page's only running commentary on the call, so it has to be
         announced. The dot repeats it in colour alone and is skipped. -->
    <div class="status" role="status"><span class="dot" id="dot" aria-hidden="true"></span><span id="status"></span></div>

    <button id="start">Start call</button>
    <button id="end" class="secondary" hidden>End call</button>
    <!-- A refusal or a dropped call interrupts what the caller was doing, so it interrupts
         the screen reader too, rather than queueing behind the status line. -->
    <p class="reason" id="reason" role="alert" hidden></p>
    <p class="hint" id="hint">Your microphone is used only while the call is running.</p>

    <section class="transcript" id="transcript" hidden aria-live="polite"></section>
  </div>
</main>

<script type="module">
// Pinned exactly, not to the @2 range. This script shares an origin with the microphone
// permission and the public key, so it should not silently become a different build.
import Vapi from "https://esm.sh/@vapi-ai/web@2.7.1";
import { initialState, reduce, view, END_TIMEOUT_MS } from "./call-state.js";

const el = (id) => document.getElementById(id);
const startBtn = el("start");
const endBtn = el("end");
const reason = el("reason");
const transcript = el("transcript");
const hint = el("hint");

let state = initialState();
let vapi = null;
let config = null;
let endTimer = null;

/**
 * The page holds no state of its own. Every event goes through the machine in call-state.js,
 * and the DOM is re-rendered from the result, so the screen cannot drift into a state the
 * machine was never put in.
 */
function dispatch(event) {
  const step = reduce(state, event);
  state = step.state;
  for (const effect of step.effects) perform(effect);
  render();
}

function perform(effect) {
  if (effect === "stop-call") {
    // The call is not known to be over just because an error was reported, so stop it
    // explicitly. Any "call-end" this provokes is ignored by the machine, which has moved on.
    try {
      if (vapi) vapi.stop();
    } catch {
      // Already closed. The machine has recorded the outcome either way.
    }
    return;
  }
  if (effect === "arm-end-timer") {
    clearTimeout(endTimer);
    endTimer = setTimeout(() => dispatch({ type: "end-timeout" }), END_TIMEOUT_MS);
    return;
  }
  if (effect === "cancel-end-timer") {
    clearTimeout(endTimer);
    endTimer = null;
    return;
  }
  if (effect === "clear-transcript") {
    transcript.replaceChildren();
    transcript.hidden = true;
  }
}

function render() {
  const v = view(state);

  el("status").textContent = v.status;
  el("dot").className = v.tone ? "dot " + v.tone : "dot";

  startBtn.hidden = !v.start.visible;
  startBtn.disabled = !v.start.enabled;
  startBtn.textContent = v.start.label;

  endBtn.hidden = !v.end.visible;
  endBtn.disabled = !v.end.enabled;

  // Unhidden before the text is written: a live region that is still hidden when its content
  // changes is not reliably announced, so the order here is what makes the alert audible.
  reason.hidden = !v.reason;
  reason.className = v.reasonTone === "warn" ? "reason" : "reason error";
  reason.textContent = v.reason;

  hint.hidden = !v.hintVisible;
}

function addLine(who, text) {
  transcript.hidden = false;
  const row = document.createElement("div");
  row.className = who === "You" ? "line caller" : "line agent";
  const label = document.createElement("span");
  label.className = "who";
  label.textContent = who;
  const body = document.createElement("span");
  body.textContent = text;
  row.append(label, body);
  transcript.append(row);
  transcript.scrollTop = transcript.scrollHeight;
}

async function loadConfig() {
  const res = await fetch("/config");
  if (!res.ok) throw new Error("The page could not reach the support service.");
  const body = await res.json();
  if (!body.publicKey || !body.assistantId) throw new Error("The voice service is not configured yet.");
  return body;
}

/**
 * A passive check, so the page does not raise a permission prompt before the caller has asked
 * for anything. It can only report a standing refusal; a browser that will prompt reports
 * nothing, and the real request happens on click, where the caller has given a reason for it.
 */
async function standingMicrophoneRefusal() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "This browser cannot use a microphone. Try Chrome, Edge or Safari.";
  }
  try {
    const status = await navigator.permissions.query({ name: "microphone" });
    return status.state === "denied"
      ? "Microphone access is blocked. Allow it in your browser settings, then reload this page."
      : null;
  } catch {
    // Not every browser can be asked about the microphone without prompting. Say nothing and
    // find out on click rather than prompting now.
    return null;
  }
}

/** Asks for the microphone at the moment the caller has asked for a call. */
async function microphoneRefusal() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((track) => track.stop());
    return null;
  } catch (err) {
    return err && err.name === "NotAllowedError"
      ? "Microphone access was refused, so the call cannot start."
      : "No microphone was found. Connect one and try again.";
  }
}

function attach(instance) {
  instance.on("call-start", () => dispatch({ type: "call-started" }));
  instance.on("speech-start", () => dispatch({ type: "speech-started" }));
  instance.on("speech-end", () => dispatch({ type: "speech-ended" }));
  instance.on("call-end", () => dispatch({ type: "call-ended" }));
  instance.on("error", (err) => {
    const message = err && typeof err.errorMsg === "string" ? err.errorMsg : "The call could not continue.";
    dispatch({ type: "error", message });
  });
  instance.on("message", (msg) => {
    const isFinal = msg && msg.type === "transcript" && msg.transcriptType === "final";
    if (!isFinal || typeof msg.transcript !== "string" || !msg.transcript.trim()) return;

    const fromAssistant = msg.role === "assistant";
    addLine(fromAssistant ? "Assistant" : "You", msg.transcript.trim());
    // A final caller transcript is the last signal before the wait for the model, which runs
    // to several seconds. Reporting that wait as "Thinking" is the difference between a pause
    // the caller understands and one they read as the line having dropped.
    if (!fromAssistant) dispatch({ type: "caller-finished" });
  });
}

startBtn.addEventListener("click", async () => {
  const before = state;
  dispatch({ type: "start-clicked" });
  // The machine refuses a start whenever a call may still be running, which is what stops a
  // click on the error screen from stacking a second call on top of the first.
  if (state === before) return;

  // The page is now in "requesting-microphone", so the permission prompt the caller is
  // looking at is the thing the status line is describing.
  const refusal = await microphoneRefusal();
  if (refusal) {
    dispatch({ type: "start-failed", message: refusal });
    return;
  }
  dispatch({ type: "microphone-granted" });

  try {
    // One instance, reused across calls. Checked against the pinned SDK rather than assumed:
    // stop() sets started=false, destroys the underlying call and nulls it, and start() only
    // refuses while started is true, so a second call is accepted. The listeners attached
    // here live on the Vapi emitter, which stop() does not clear, and the SDK re-registers
    // its own per-call listeners on each start, so every event still arrives exactly once.
    if (!vapi) {
      vapi = new Vapi(config.publicKey);
      attach(vapi);
    }
    await vapi.start(config.assistantId);
  } catch (err) {
    dispatch({ type: "start-failed", message: err && err.message ? err.message : "Something went wrong starting the call." });
  }
});

endBtn.addEventListener("click", () => {
  dispatch({ type: "end-clicked" });
  // Asking to stop is separate from deciding the call is over. If the acknowledgement never
  // arrives, the timer armed above resets the page rather than leaving it on "Ending".
  try {
    if (vapi) vapi.stop();
  } catch {
    dispatch({ type: "call-ended" });
  }
});

(async function init() {
  render();
  try {
    config = await loadConfig();
  } catch (err) {
    dispatch({ type: "config-failed", message: err.message });
    return;
  }
  const refusal = await standingMicrophoneRefusal();
  dispatch(refusal ? { type: "mic-blocked", message: refusal } : { type: "ready" });
})();
</script>
</body>
</html>
